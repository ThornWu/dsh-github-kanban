# CI(阶段 3 / S3.6):语法/静态检查、测试矩阵、分发包内容检查。
#
# 约束(REMEDIATION_PLAN §6):
#   - 不依赖任何个人 token:仓库为只读 checkout,步骤只用公开 actions 与 npm 官方源;
#   - 依赖安装可复现:npm ci 按 package-lock.json 精确安装(devDependencies 仅测试用,
#     分发仍为浏览器单文件,见 test/pack.test.mjs 的清单断言);
#   - 测试矩阵:Node 20/22/24(devDependencies 需 >=20;插件运行时 engines >=18 不受影响)。
#
# 注意:本文件生效需推送到远端;在推送前,本地同等命令(npm ci && npm test &&
# npm run test:strict)全部通过 —— 两者的一致性由脚本内容唯一来源保证。
name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Install (locked devDependencies)
        run: npm ci
      - name: Lint (syntax check) + smoke + unit + react + pack content
        run: npm test
      - name: Strict mode (unhandled rejections fail the run)
        run: npm run test:strict

  package:
    name: distribution package content
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: npm pack --dry-run with content assertions
        run: npm run pack:check
