# dsh-github-kanban bundle:一个包同时挂宿主服务与浏览器半边(右栏看板 tab)。
#
# 只需一行 insert:client-modules 是按 **loader 行**去扫该包 package.json 的 dsh.client 声明的,
# 扫到就把 exports["./client"] 提供给浏览器。所以不需要像 agent-team-profile 那样为 UI 单开一行
# —— 那里是三个独立包,才有三行 insert。
#
# Phase 1.2 起在这里加 config:轮询间隔、token 环境变量名等(值一律不含凭据本身)。
# repos(2026-10-01 集成):仓库级项目来源,owner/name 列表;link 到这些仓的 Projects v2
# 会并进切换器(用户级项目同 id 去重时保留仓归属版本)。token 仍只走环境变量,永不进配置。
- insert:
    - id: thorn-github-kanban
      name: '@local/thorn-github-kanban'
      config:
        repos:
          - ThornWu/thorn-agent
          - ThornWu/thornwu-com
          - ThornWu/chaoshan-asr

